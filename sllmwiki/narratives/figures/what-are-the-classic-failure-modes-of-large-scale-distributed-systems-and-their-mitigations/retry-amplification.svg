<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<desc>Attempts reaching a service when each of n layers tries a call 3 times: 3^n, so 3, 9, 27 and 81 for 1 to 4 layers; 2 layers (9 attempts) is the Azure transient-fault guidance's example and is shaded red.</desc>
<rect width="640" height="360" fill="#ffffff"/>
<line x1="70" y1="300.0" x2="620" y2="300.0" stroke="#d0d0d0" stroke-width="1"/>
<text x="62" y="304.0" text-anchor="end" font-size="12" fill="#111111" font-family="Helvetica, Arial, sans-serif">0</text>
<line x1="70" y1="240.0" x2="620" y2="240.0" stroke="#d0d0d0" stroke-width="1"/>
<text x="62" y="244.0" text-anchor="end" font-size="12" fill="#111111" font-family="Helvetica, Arial, sans-serif">20</text>
<line x1="70" y1="180.0" x2="620" y2="180.0" stroke="#d0d0d0" stroke-width="1"/>
<text x="62" y="184.0" text-anchor="end" font-size="12" fill="#111111" font-family="Helvetica, Arial, sans-serif">40</text>
<line x1="70" y1="120.0" x2="620" y2="120.0" stroke="#d0d0d0" stroke-width="1"/>
<text x="62" y="124.0" text-anchor="end" font-size="12" fill="#111111" font-family="Helvetica, Arial, sans-serif">60</text>
<line x1="70" y1="60.0" x2="620" y2="60.0" stroke="#d0d0d0" stroke-width="1"/>
<text x="62" y="64.0" text-anchor="end" font-size="12" fill="#111111" font-family="Helvetica, Arial, sans-serif">80</text>
<line x1="70" y1="300" x2="620" y2="300" stroke="#111111" stroke-width="1.2"/>
<line x1="70" y1="30" x2="70" y2="300" stroke="#111111" stroke-width="1.2"/>
<rect x="147.7" y="291.0" width="83.7" height="9.0" fill="#1f5fa8"/>
<text x="189.6" y="285.0" text-anchor="middle" font-size="13" fill="#111111" font-family="Helvetica, Arial, sans-serif">3</text>
<text x="189.6" y="318" text-anchor="middle" font-size="12" fill="#111111" font-family="Helvetica, Arial, sans-serif">1 layer</text>
<rect x="267.3" y="273.0" width="83.7" height="27.0" fill="#b03a2e"/>
<text x="309.1" y="267.0" text-anchor="middle" font-size="13" fill="#111111" font-family="Helvetica, Arial, sans-serif">9</text>
<text x="309.1" y="318" text-anchor="middle" font-size="12" fill="#111111" font-family="Helvetica, Arial, sans-serif">2 layers</text>
<rect x="386.8" y="219.0" width="83.7" height="81.0" fill="#1f5fa8"/>
<text x="428.7" y="213.0" text-anchor="middle" font-size="13" fill="#111111" font-family="Helvetica, Arial, sans-serif">27</text>
<text x="428.7" y="318" text-anchor="middle" font-size="12" fill="#111111" font-family="Helvetica, Arial, sans-serif">3 layers</text>
<rect x="506.4" y="57.0" width="83.7" height="243.0" fill="#1f5fa8"/>
<text x="548.3" y="51.0" text-anchor="middle" font-size="13" fill="#111111" font-family="Helvetica, Arial, sans-serif">81</text>
<text x="548.3" y="318" text-anchor="middle" font-size="12" fill="#111111" font-family="Helvetica, Arial, sans-serif">4 layers</text>
<text x="345.0" y="345" text-anchor="middle" font-size="14" fill="#111111" font-family="Helvetica, Arial, sans-serif">layers that each try a call 3 times</text>
<text x="18" y="165.0" text-anchor="middle" font-size="14" fill="#111111" font-family="Helvetica, Arial, sans-serif" transform="rotate(-90 18 165.0)">attempts reaching the service</text>
</svg>
