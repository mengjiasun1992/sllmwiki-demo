<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<desc>Weight of a sample j steps old in server A's EWMA: alpha(1 - alpha)^j with alpha = 1 - e^(-0.1) = 0.0952, for j = 0 to 40; the weight halves every ln 2 / -ln(1 - alpha) = 6.93 samples. Dashed: a simple moving average of k = 2/alpha - 1 = 20 samples, weight 1/20 = 0.05 each.</desc>
