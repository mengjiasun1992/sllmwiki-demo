  ingested: "2026-10-25"
  license: Apache-2.0
  license_url: https://github.com/twitter/finagle/blob/develop/LICENSE
  tags: [ewma]
  abstract: "The Clients page of Twitter's Finagle user guide (Apache-2.0), describing how a Finagle client is built from a protocol implementation, a transport (with TLS, HTTP and SOCKS5 proxies) and a stack of client modules: observability, retries, timeouts and expiration, request draining, load balancing, circuit breaking and pooling, followed by admission control, response classification, MethodBuilder and partition-aware clients. Its load-balancing section explains that a balancer splits into a load metric each endpoint maintains and a distributor that uses it to choose an endpoint, among interchangeable endpoints of a replica set. Configurations: a heap of least-loaded endpoints by outstanding requests; power of two choices (P2C), the default, which picks two endpoints at random and selects the less loaded; P2C with peak EWMA, a moving average of round-trip time highly sensitive to peaks, weighted by outstanding requests, which reacts to slow endpoints faster than least loaded but assumes a loaded endpoint takes time to recover, an assumption long-polling clients break (decayTime defaults to 10 seconds, with a 100-second example); and aperture balancers. A footnote marks several configurations experimental, with APIs that may change."

raft-ongaro-dissertation-ch3-basic-raft:
  file: sources/raft-ongaro-dissertation-ch3-basic-raft.md
  kind: tex
  url: https://github.com/ongardie/dissertation/blob/master/basicraft/raft.tex
  published: "2014-08-01"
  ingested: "2026-10-27"
  license: CC-BY-4.0
  license_url: https://github.com/ongardie/dissertation/blob/master/LICENSE
  tags: [raft]
  abstract: "Chapter 3, 'Basic Raft algorithm', of Diego Ongaro's Stanford PhD dissertation 'Consensus: Bridging Theory and Practice' (2014, CC BY 4.0), saved from its LaTeX source; it is the extended form of the Raft paper's core. It opens with the design goal of understandability, pursued by decomposing the problem and shrinking the state space, including randomized election timeouts. It lists Raft's five guarantees (Election Safety, Leader Append-Only, Log Matching, Leader Completeness, State Machine Safety) and splits consensus into leader election, log replication and safety. The basics: servers are leaders, followers or candidates; time is divided into numbered terms that act as a logical clock, so a server with a stale term steps down or is rejected; only two RPCs, RequestVote and AppendEntries. Leader election: heartbeats, election timeout, majority vote with one vote per term, and randomized timeouts against split votes. Log replication: commitment once the creating leader has stored an entry on a majority, the AppendEntries consistency check on the preceding entry's index and term, and nextIndex backoff to force follower logs to match the leader's. Safety: the election restriction (vote only for an at-least-as-up-to-date log), committing only current-term entries by counting replicas, and a proof sketch of Leader Completeness. Then follower and candidate crashes (retries, idempotent RPCs), persisted state (current term, vote, log), the timing requirement broadcastTime << electionTimeout << MTBF, and leadership transfer. LaTeX macros such as the algorithm's name and units drop out of the converted text."

raft-ongaro-dissertation-ch9-leader-election:
  file: sources/raft-ongaro-dissertation-ch9-leader-election.md
  kind: tex
  url: https://github.com/ongardie/dissertation/blob/master/leaderelection/leaderelection.tex
  published: "2014-08-01"
  ingested: "2026-10-27"
  license: CC-BY-4.0
  license_url: https://github.com/ongardie/dissertation/blob/master/LICENSE
  tags: [raft]
  abstract: "Chapter 9, 'Leader election evaluation', of Diego Ongaro's Stanford PhD dissertation 'Consensus: Bridging Theory and Practice' (2014, CC BY 4.0), saved from its LaTeX source. It analyzes how quickly Raft elects a new leader after one fails. It notes that by the FLP impossibility result no fault-tolerant consensus protocol can deterministically terminate in a purely asynchronous model, which in Raft shows up as split votes, so election performance can only be described probabilistically and under assumptions (random timeouts, similar clock rates, timely or stopped servers), while safety always holds. Conclusions: without split votes an election completes about a third of the way into the timeout range; split votes stay rare when the timeout range is 10 to 20 times the one-way network latency; the number of terms needed is geometric, so leaders are elected within about 20 times the one-way latency on average; on a real LAN elections took tens of milliseconds and on a simulated US-wide WAN 99.9% finished within 3 seconds even with two of five servers failed. Simulation shows the log comparison in RequestVote barely affects election time. It then describes how a partitioned server that keeps incrementing its term disrupts the cluster when it rejoins, forcing the leader to step down, and the Pre-Vote extension that prevents this by having a candidate increment its term only after a majority says it would grant its vote. It closes with open questions on asymmetric networks, packet loss and clock drift."

raft-etcd-raft-readme:
  file: sources/raft-etcd-raft-readme.md
  kind: text
  url: https://github.com/etcd-io/raft/blob/main/README.md
  ingested: "2026-10-27"
  license: Apache-2.0
  license_url: https://github.com/etcd-io/raft/blob/main/LICENSE
  tags: [raft]
  abstract: "The README of etcd-io/raft (Apache-2.0), the Go Raft library used by etcd, Kubernetes, CockroachDB, TiKV, Docker Swarm and others, and described as the most widely used Raft library in production. It cites Ongaro and Ousterhout's Raft paper and says the library is up to date with Ongaro's final thesis. Its design is minimal: it implements only the core algorithm as a deterministic state machine whose input is a message (a local tick or a peer's message) and whose output is messages, log entries and state changes; network transport and persistent storage are left to the application. Features: leader election, log replication, log compaction, membership changes, leadership transfer, linearizable read-only queries (ReadIndex with a quorum check, or lease-based reads that rely on clocks), plus optional enhancements including pipelining, flow control, batching, parallel leader disk writes, proposal forwarding from followers, automatic stepping down when the leader loses quorum, and protection against unbounded log growth when quorum is lost. The usage section shows starting and restarting nodes and the Ready loop: persist entries and HardState before sending messages that depend on them, discard persisted entries at or after a newly written index, send messages, apply committed entries and configuration changes, then Advance, and call Tick for the heartbeat and election timeouts. It notes proposals may need re-proposing after a timeout, node IDs must never be reused, and its one-at-a-time membership changes take effect when applied, so three or more nodes are recommended."

failure-modes-azure-retry-storm-antipattern:
  file: sources/failure-modes-azure-retry-storm-antipattern.md
  kind: html
  url: https://learn.microsoft.com/en-us/azure/architecture/antipatterns/retry-storm/
  ingested: "2026-10-27"
  license: CC-BY-4.0
  license_url: https://github.com/MicrosoftDocs/architecture-center/blob/main/LICENSE
  tags: [failure-modes]
  abstract: "Microsoft's Retry Storm antipattern page in the Azure Architecture Center (CC BY 4.0). When a service becomes unavailable or busy, frequent client retries can keep it from recovering and worsen the problem, a situation it also calls a thundering herd; retrying forever is pointless because requests are only valid for a limited time. It shows a client that retries immediately in an endless loop. Client-side remedies: limit the number and duration of retries (most applications need seconds or minutes), pause between attempts with growing waits such as exponential backoff, handle faults gracefully by returning an error, use the Circuit Breaker pattern, honor retry-after headers, rely on SDKs, libraries or a service mesh with built-in retry policies, and batch or pool requests. Service-side remedies: a gateway that can block connections during incidents (the Bulkhead pattern), throttling at the gateway, and sending retry-after signals. It warns not to retry errors such as 400 Bad Request that signal an invalid request, and to align retry duration with business needs. Symptoms: long response times and repeated retries in client telemetry; many requests from one client, slow recovery, or cascading failures right after a fault is repaired on the service side. It closes with example diagnoses from client and gateway telemetry."

failure-modes-azure-queue-based-load-leveling:
  file: sources/failure-modes-azure-queue-based-load-leveling.md
  kind: html
  url: https://learn.microsoft.com/en-us/azure/architecture/patterns/queue-based-load-leveling
  ingested: "2026-10-27"
  license: CC-BY-4.0
  license_url: https://github.com/MicrosoftDocs/architecture-center/blob/main/LICENSE
  tags: [failure-modes]
  abstract: "Microsoft's Queue-Based Load Leveling pattern from the Azure Architecture Center (CC BY 4.0). Intermittent heavy loads from many concurrent tasks can overload a shared service such as a cache or data store, making it slow or causing it to fail under contention. The pattern places a queue between the tasks and the service so they run asynchronously: the queue buffers messages and the service consumes them at its own pace, so demand peaks don't reach it directly and tasks aren't delayed while it is unavailable. Benefits: availability, scalability, and sizing for average rather than peak load; it notes throttling as an alternative that reduces functionality. Considerations: control the consumer rate so spikes aren't passed downstream; autoscaling consumers without bounding their aggregate downstream rate only moves overload to dependencies; if producers outpace consumers on average the queue and latency grow, so monitor depth and shed work at the producer; queues need durability; at-least-once delivery requires idempotent consumers; poison messages go to a dead-letter queue; ordering isn't preserved by default. It is unsuitable when callers need a low-latency synchronous response. An example levels writes from several web app instances to a data store through Service Bus and Azure Functions."

failure-modes-wikipedia-thundering-herd:
  file: sources/failure-modes-wikipedia-thundering-herd.md
  kind: html
  url: https://en.wikipedia.org/wiki/Thundering_herd_problem
  ingested: "2026-10-27"
  license: CC-BY-SA-4.0
  license_url: https://creativecommons.org/licenses/by-sa/4.0/
  tags: [failure-modes]
  abstract: "The Wikipedia article on the thundering herd problem (CC BY-SA 4.0). It defines it as a performance-degrading phenomenon in which many processes or threads are woken at once by an event or a newly available resource, but only one can handle it, so the rest fail and go back to sleep, wasting CPU and slowing the one that succeeds. When it happens on a cache it is often called a cache stampede. Mitigations: the Linux kernel serializes responses for requests on a single file descriptor so only one waiter wakes, and epoll gained an EPOLLEXCLUSIVE flag in Linux 4.5; Windows I/O completion ports can be configured to wake only one waiting thread. In systems that retry with a backoff mechanism such as exponential backoff, jitter, randomness added to the wait between retries, breaks the synchronization between clients so their retries no longer collide. It links related problems: lock convoys, TCP global synchronization and cache stampedes. The article is short and mostly sourced to practitioner material."

failure-modes-wikipedia-split-brain:
  file: sources/failure-modes-wikipedia-split-brain.md
  kind: html
  url: https://en.wikipedia.org/wiki/Split-brain_(computing)
  ingested: "2026-10-27"
  license: CC-BY-SA-4.0
  license_url: https://creativecommons.org/licenses/by-sa/4.0/
  tags: [failure-modes]
  abstract: "The Wikipedia article on split-brain in computing (CC BY-SA 4.0), flagged by Wikipedia for possible original synthesis and missing citations. Split-brain is a state of data or availability inconsistency from maintaining two separate data sets that overlap in scope, typically because servers stop communicating and synchronizing, a network partition. In high-availability clusters that monitor each other over a private heartbeat network, losing all those links while nodes keep running can leave each node believing it is the only one running and serving clients with its own uncoordinated updates, which can corrupt data and require operator cleanup. Following Davidson, Garcia-Molina and Skeen's survey, approaches are optimistic or pessimistic. Optimistic ones keep all partitions working, trading correctness for availability, and reconcile afterwards (Hazelcast). Pessimistic ones trade availability for consistency: typically a quorum-consensus approach lets the sub-partition with a majority of votes stay available while the others fence themselves (MongoDB replica sets, Galera). Commercial HA clusters combine heartbeat links with quorum witness storage; a two-node cluster without a witness cannot tell which node should be active and may fail entirely until a human intervenes. It also notes split-horizon DNS as a deliberate use of the term."

failure-modes-bronson-metastable-failures:
  kind: link
  url: https://sigops.org/s/conferences/hotos/2021/papers/hotos21-s11-bronson.pdf
  published: "2021-06-01"
  ingested: "2026-10-27"
  license: proprietary
  tags: [failure-modes]
  abstract: "Nathan Bronson, Abutalib Aghayev, Aleksey Charapko and Timothy Zhu, 'Metastable Failures in Distributed Systems', HotOS 2021, 7 pages (ACM; the authors' PDF on the SIGOPS site carries ACM's standard copyright notice, so the wiki keeps a link). From a decade of operating hyperscale distributed systems, the authors identify metastable failures, a class of failures that can disrupt such systems even when there are no hardware failures or configuration errors. Today they appear as black swan events: outliers that nothing in the past points to, with severe impact, and much easier to explain in hindsight than to predict. Instances look different on the surface, but the paper argues they fit one framework, which it introduces and applies to examples observed in production: request retries, a look-aside cache, slow error handling, and link imbalance (Section 2). Section 3 surveys the ad hoc techniques developed after the fact to make systems resilient to known metastable failures, and Section 4 discusses research directions; a systematic way to build systems robust against unknown metastable failures remains, the authors say, an open problem. Only the abstract and outline were read when this link was recorded."

failure-modes-huang-gray-failure:
  kind: link
  url: https://www.microsoft.com/en-us/research/wp-content/uploads/2017/06/paper-1.pdf
  published: "2017-05-08"
  ingested: "2026-10-27"
  license: proprietary
  tags: [failure-modes]
  abstract: "Peng Huang, Chuanxiong Guo, Lidong Zhou, Jacob R. Lorch, Yingnong Dang, Murali Chintalapati and Randolph Yao (Microsoft Research and Microsoft Azure), 'Gray Failure: The Achilles' Heel of Cloud-Scale Systems', HotOS 2017, 6 pages (ACM; kept as a link). Cloud scale provides the resources to replace failed components, but only if failures can be detected; the paper argues that the major availability breakdowns and performance anomalies in cloud environments tend to come from gray failure, subtle underlying faults, rather than fail-stop failure. Its examples include severe performance degradation, random packet loss, flaky I/O, memory thrashing, capacity pressure and non-fatal exceptions. Section 2 draws on production experience under the headings high redundancy hurts, under the radar of failure detectors, recovery that kills rather than heals, and the blame game. Section 3 models gray failure, whose key feature is differential observability: the system's failure detectors may not notice problems even when applications are afflicted by them. Section 4 discusses closing the observation gap, approximating application views, leveraging scale and harnessing temporal patterns, toward bridging the gap between components' perceptions of what constitutes failure. Only the abstract and outline were read when this link was recorded."

paged-attention-kwon-sosp2023:
  file: sources/paged-attention-kwon-sosp2023.md
  kind: pdf
  url: https://arxiv.org/pdf/2309.06180
  published: "2023-09-12"
  ingested: "2026-10-27"
  license: CC-BY-4.0
  license_url: https://creativecommons.org/licenses/by/4.0/
  tags: [paged-attention, llm-serving]
  abstract: "Kwon and colleagues (SOSP 2023) introduce PagedAttention and vLLM, an LLM serving system built on it. Serving large language models is limited by GPU memory for the key-value (KV) cache, which grows with each request and is wasted by reservation and fragmentation: existing systems reserve one contiguous chunk per request for its maximum length, and the paper measures effective memory as low as 20.4 percent. PagedAttention splits each request's KV cache into fixed-size blocks that need not be contiguous in GPU memory, mapped by a block table, as operating-system paging maps virtual pages to physical ones. The paper's sections cover the memory challenges (section 3), the PagedAttention algorithm and KV cache manager (sections 4.1 and 4.2), decoding, scheduling and preemption, and evaluation, where vLLM is reported to improve throughput 2 to 4 times over FasterTransformer and Orca at similar latency. Sharing of prompt and beam-search cache blocks is the main source of the savings. Only the abstract and sections 3, 4.1 and 4.2 were read for the wiki; the other sections are outline only."

paged-attention-vllm-design-doc:
  file: sources/paged-attention-vllm-design-doc.md
  kind: text
  url: https://raw.githubusercontent.com/vllm-project/vllm/main/docs/design/paged_attention.md
  ingested: "2026-10-27"
  license: Apache-2.0
  license_url: https://www.apache.org/licenses/LICENSE-2.0
  tags: [paged-attention, llm-serving]
  abstract: "The vLLM project's design document for its PagedAttention kernel, the GPU code that computes attention when the KV cache is stored in blocks. It defines the terms the kernel needs. A sequence is one client request. Each sequence's key and value cache is split into blocks, each holding a fixed number of tokens (BLOCK_SIZE) for one attention head. Threads, warps and thread blocks, arranged in a grid of heads, sequences and partitions, process one block at a time. The document then follows the calculation: inputs, query, key, the query-key product, softmax (with its qk_max and exp_sum steps), value, and output. It is an implementation source: it explains how the blocked layout is computed rather than the memory argument for it, which is in the paper. Only the Concepts section was read for the wiki; the calculation sections are outline only."

attention-wikipedia-machine-learning:
  file: sources/attention-wikipedia-machine-learning.md
  kind: html
  url: https://en.wikipedia.org/wiki/Attention_(machine_learning)
  ingested: "2026-10-27"
  license: CC-BY-SA-4.0
  license_url: https://creativecommons.org/licenses/by-sa/4.0/
  tags: [attention-mechanism, transformer-architecture]
  abstract: "Wikipedia's article on attention in machine learning, an encyclopedia overview. Attention lets a model build, for each query, a weighted combination of values, with the weights set by how well the query matches each key. The article gives standard scaled dot-product attention, softmax(QK^T / sqrt(d_k)) V, and notes its permutation properties: it is equivariant to reordering the queries and invariant to reordering the key-value pairs. Multi-head attention runs several attention heads with their own learned projections and concatenates their outputs before a final projection. The headings also cover masked attention, self-attention, and optimizations such as FlashAttention. Only the standard scaled dot-product attention and multi-head attention sections were read for the wiki; the rest is outline only."

transformer-wikipedia-deep-learning-architecture:
  file: sources/transformer-wikipedia-deep-learning-architecture.md
  kind: html
  url: https://en.wikipedia.org/wiki/Transformer_(deep_learning_architecture)
  ingested: "2026-10-27"
  license: CC-BY-SA-4.0
  license_url: https://creativecommons.org/licenses/by-sa/4.0/
  tags: [transformer-architecture, attention-mechanism]
  abstract: "Wikipedia's article on the transformer, an encyclopedia overview of the architecture and its history. The architecture stacks tokenization, embeddings, positional encoding, attention blocks, feedforward networks, an encoder and a decoder. Its attention is scaled dot-product attention, used in several heads (multihead attention) and with masking in the decoder. A later section covers efficient inference. It explains KV caching: the key and value vectors already computed for earlier tokens are saved and not recomputed at each new token. It separates prefilling, which computes the cache for the prompt, from decoding, which generates tokens one at a time, and notes that PagedAttention applies memory paging to KV caching. Only the KV caching section was read for the wiki; the other sections are outline only."

attention-vaswani-2017-attention-is-all-you-need:
  kind: link
  url: https://arxiv.org/abs/1706.03762
  ingested: "2026-10-27"
  license: unknown
  tags: [attention-mechanism, transformer-architecture]
  abstract: "The abstract of Vaswani and colleagues' 2017 paper that introduced the Transformer, as shown on its arXiv abstract page. The dominant sequence transduction models use recurrent or convolutional networks in an encoder-decoder configuration, and the best ones connect encoder and decoder through an attention mechanism. The paper proposes the Transformer, a network built only from attention, with no recurrence and no convolutions. It reports higher translation quality, more parallel computation and much shorter training time: 28.4 BLEU on WMT 2014 English-to-German, and a single-model 41.8 BLEU on English-to-French. It also reports good generalization to English constituency parsing. Only the abstract page was read; the paper itself was not read, and this link is not cited for any claim."
