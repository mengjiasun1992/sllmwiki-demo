# The tag tree: each tag's description, parent and SMEs (design doc §4.2).
# Written by manifest.py; children, sources and narratives are derived.

distributed-systems:
  description: Systems of independent networked computers that coordinate by passing messages to appear as one system
  parent: null

distributed-system-design:
  description: "Design tenets and principles for building distributed systems: failure, consistency, scalability, idempotency, backpressure"
  parent: distributed-systems

moving-averages:
  description: Moving averages for smoothing a series of measurements over time
  parent: null

ewma:
  description: "The exponentially weighted moving average: its recurrence, smoothing factor, and uses in software"
  parent: moving-averages

simple-moving-average:
  description: Simple and weighted windowed moving averages, the alternatives to an EWMA
  parent: moving-averages

calm-theorem:
  description: "The CALM theorem: consistency as logical monotonicity, which distributed programs need no coordination"
  parent: distributed-system-design

consensus:
  description: "Consensus: getting a group of servers to agree on values despite failures, the core of replicated state machines"
  parent: distributed-systems

raft:
  description: "The Raft consensus algorithm: leader election, log replication and safety for a replicated log"
  parent: consensus

failure-modes:
  description: Classic failure modes of large-scale distributed systems (crashes, partitions, overload, cascading and metastable failures, retry storms, bad changes) and how to prevent or mitigate them
  parent: distributed-system-design

machine-learning:
  description: "Machine learning: models that learn their behaviour from data"
  parent: null

transformer-architecture:
  description: "Transformer models: the attention-based network design behind modern language models"
  parent: machine-learning

attention-mechanism:
  description: "Attention: how a transformer weighs other tokens when it builds each token's representation"
  parent: transformer-architecture

llm-serving:
  description: "Serving large language models: running inference for many requests on limited accelerator memory"
  parent: machine-learning

paged-attention:
  description: "Paged attention: storing the attention key-value cache in fixed-size blocks, as an operating system pages memory"
  parent: llm-serving
